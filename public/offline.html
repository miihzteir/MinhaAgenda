<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Minha Agenda — sem conexão</title>
<style>
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:#faf6f1; font-family: system-ui, sans-serif; color:#3a2e27; padding:24px; text-align:center; }
  .card { max-width: 380px; }
  .badge { width:56px; height:56px; border-radius:16px; background:#a9785f; margin:0 auto 20px; display:flex; align-items:center; justify-content:center; color:#faf6f1; font-size:24px; font-weight:700; }
  h1 { font-size:20px; margin:0 0 8px; }
  p { font-size:14px; color:#5c4c40; line-height:1.5; }
  button { margin-top:18px; background:#a9785f; color:#faf6f1; border:none; padding:10px 20px; border-radius:12px; font-size:14px; cursor:pointer; }
</style>
</head>
<body>
  <div class="card">
    <div class="badge">C</div>
    <h1>Você está sem conexão</h1>
    <p>Sem problemas — o que já foi carregado antes continua disponível offline. Assim que a internet voltar, tudo será sincronizado automaticamente.</p>
    <button onclick="location.reload()">Tentar novamente</button>
  </div>
</body>
</html>
